    <script>
      (function () {
        'use strict';
        const LOGIN_URL = 'https://www.prudle-education.com/log-in-out';

        if (location.hostname.includes('webflow.com')) {
          return;
        }

        window.addEventListener('message', function (e) {
          if (e.data === 'PRUDLE_LOGOUT') {
            localStorage.clear();
            sessionStorage.clear();
            try {
              if (window.top && window.top !== window) {
                window.top.location.replace(LOGIN_URL);
                return;
              }
            } catch (_) {}
            window.location.replace(LOGIN_URL);
          }
        });

        window.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
          }
        }, { capture: true });

        const hostname = location.hostname.toLowerCase();
        const isDev = hostname === 'localhost' || hostname === '127.0.0.1' || hostname.endsWith('.run.app') || hostname.endsWith('.aistudio-preview.com') || hostname === '';
        if (isDev) {
          // Pre-populate admin in dev environment if missing so sandbox preview is functional
          if (!localStorage.getItem('username') || !localStorage.getItem('role')) {
            localStorage.setItem('username', 'admin');
            localStorage.setItem('role', 'admin');
            localStorage.setItem('loginDate', new Date().toDateString());
          }
          return;
        }

        function checkAdmin() {
          const user = localStorage.getItem('username');
          const role = String(
            localStorage.getItem('role') ||
            localStorage.getItem('userRole') ||
            ''
          ).trim().toLowerCase();

          const last = localStorage.getItem('loginDate');
          const today = new Date().toDateString();

          console.log('USER:', user);
          console.log('ROLE:', role);
          console.log('LOGIN DATE:', last);
          console.log('TODAY:', today);

          if (!user || !role || last !== today) {
            localStorage.clear();
            sessionStorage.clear();
            try {
              if (window.top && window.top !== window) {
                window.top.location.replace(LOGIN_URL);
                return false;
              }
            } catch (_) {}
            window.location.replace(LOGIN_URL);
            return false;
          }

          if (role !== 'admin') {
            alert('هذه الصفحة للأدمن فقط');
            try {
              if (window.top && window.top !== window) {
                window.top.location.replace(LOGIN_URL);
                return false;
              }
            } catch (_) {}
            window.location.replace(LOGIN_URL);
            return false;
          }

          return true;
        }

        checkAdmin();
      })();
    </script>
