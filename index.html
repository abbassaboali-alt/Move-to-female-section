    <script>
      (function(){
        'use strict';
        const login='https://www.prudle-education.com/log-in-out';
        const host=location.hostname.toLowerCase();
        const allowed=['www.prudle-education.com','prudle-education.com','abbassaboali-alt.github.io','app.prudle.edu.sa'];
        const dev=host==='localhost'||host==='127.0.0.1'||host.endsWith('.run.app')||host.endsWith('.webcontainer.io');
        if(!dev&&(location.protocol!=='https:'||!allowed.includes(host))){location.replace(login);return;}
        window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s')e.preventDefault();},{capture:true});
        // Do not clear login state or expire sessions on a change of calendar day.
        // The Cloudflare Worker validates the Firebase token and permissions.
        window.addEventListener('message',e=>{
          if(!['https://www.prudle-education.com','https://prudle-education.com','https://app.prudle.edu.sa'].includes(e.origin))return;
          if(e.data==='PRUDLE_LOGOUT')location.replace(login);
        });
      })();
    </script>
